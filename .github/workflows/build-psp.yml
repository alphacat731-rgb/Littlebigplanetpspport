name: Build LBPPSP Alpha

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Convert in-game cutscene and build PSP EBOOT
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Validate source assets
        run: python scripts/validate_assets.py --ffprobe ffprobe

      - name: Build in-game PMF video and synchronized PCM audio
        run: |
          python scripts/build_intro_pmf.py \
            --input "LBPPSP_Alpha_Video_01_tut_vo.mp4.240p.vp9.mp4" \
            --output "build/LBPPSP_ALPHA_INTRO.PMF" \
            --audio-output "build/LBPPSP_ALPHA_INTRO.PCM"

      - name: Convert loading screen PNG to PSP texture
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -i "LBPPSP_Alpha_LoadingScreen.png" \
            -vf "scale=480:272:flags=lanczos,format=rgba,pad=512:512:0:0:color=black" \
            -frames:v 1 -pix_fmt rgba -f rawvideo "build/LOADING.RGBA"
          test "$(stat -c%s build/LOADING.RGBA)" -eq 1048576


      - name: Clean PSP build
        run: |
          docker pull pspdev/pspdev:latest
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/psp \
            pspdev/pspdev:latest make clean

      - name: Compile and package EBOOT.PBP
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/psp \
            pspdev/pspdev:latest make

      - name: Validate bootable PBP structure
        run: python scripts/validate_pbp.py psp/EBOOT.PBP

      - name: Assemble Memory Stick layout
        run: |
          mkdir -p dist/PSP/GAME/LBPPSP_ALPHA
          cp psp/EBOOT.PBP dist/PSP/GAME/LBPPSP_ALPHA/EBOOT.PBP
          cp build/LBPPSP_ALPHA_INTRO.PMF dist/PSP/GAME/LBPPSP_ALPHA/INTRO.PMF
          cp build/LBPPSP_ALPHA_INTRO.PCM dist/PSP/GAME/LBPPSP_ALPHA/INTRO.PCM
          cp build/LOADING.RGBA dist/PSP/GAME/LBPPSP_ALPHA/LOADING.RGBA
          cat > dist/README.txt <<'EOF2'
          LBPPSP Alpha - PSP homebrew build

          Copy the PSP folder to the root of the Memory Stick.
          Start the application under Game > Memory Stick.

          On launch: the loading-screen image appears for 3 seconds, then
          the screen stays black for 2 seconds, then the intro starts automatically.
          X pauses/resumes the cutscene. O stops playback and opens the menu.

          Keep INTRO.PMF, INTRO.PCM and LOADING.RGBA beside EBOOT.PBP.
          INTRO.PMF contains the H.264 video; INTRO.PCM is its synchronized
          44.1 kHz stereo soundtrack. LOADING.RGBA is the 512x512 PSP texture
          generated from the repository's loading-screen PNG.

          This is still a bootable prototype shell, not the complete original
          LittleBigPlanet game or its original gameplay systems.
          EOF2
          zip -qr LBPPSP_ALPHA_build.zip dist

      - name: Upload PSP build
        uses: actions/upload-artifact@v4
        with:
          name: LBPPSP-Alpha-PSP-build
          path: |
            psp/EBOOT.PBP
            build/LBPPSP_ALPHA_INTRO.PMF
            build/LBPPSP_ALPHA_INTRO.PCM
            build/LOADING.RGBA
            LBPPSP_ALPHA_build.zip
          if-no-files-found: error
          retention-days: 14
